<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pet Shop — Agenda</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Pet Shop — Agenda de Banho e Tosa</h1>

        <input type="text" id="pet" placeholder="Nome do pet">
        <input type="text" id="tutor" placeholder="Nome do tutor">
        <input type="text" id="servico" placeholder="Serviço (ex: banho, tosa)">
        <input type="datetime-local" id="data">

        <button onclick="salvarAgendamento()">Agendar</button>

        <h2>Agendamentos</h2>

        <div id="lista"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
